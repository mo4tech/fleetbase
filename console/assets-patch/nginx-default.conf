server {
    listen       4200;
    server_name  localhost;

    # index.html and asset-manifest.json name every other file the app loads,
    # and those names carry content hashes. Without a Cache-Control header a
    # browser falls back to heuristic caching from Last-Modified: the stock
    # index.html is dated at image build time, so a browser could treat it as
    # fresh for weeks and keep loading superseded bundles without ever asking
    # the server. These two must always be revalidated; the hashed assets they
    # point to can still be cached forever, since a change to them changes
    # their name.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /asset-manifest.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The fleetops engine bundle is patched in place to point map tiles at
    # OpenStreetMap, which means its contents change while its filename stays
    # the same. Hashed filenames are normally cached forever, so a browser that
    # saw the stock bundle would keep using it and still load Carto tiles.
    # no-cache keeps it cached but forces a revalidation, so the ETag check
    # returns 304 in the normal case and the patched file whenever it changes.
    location ^~ /engines-dist/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }

     # Serve runtime config with no cache
    location = /fleetbase.config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files /fleetbase.config.json @config_fallback;
    }

    location @config_fallback {
        return 200 '{}';
    }
}
